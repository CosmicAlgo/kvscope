[package]
name = "kvscope-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "KV-cache capacity planner for LLM inference: reads a Hugging Face config.json"
repository = "https://github.com/CosmicAlgo/kvscope"
publish = false

[lib]
name = "kvscope_core"
path = "src/lib.rs"

[[bin]]
name = "kvscope"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line program. Off for library-only builds such as WebAssembly.
cli = ["dep:clap"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
